name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        name: Install pnpm

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate tickets
        run: pnpm tickets:check

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm fmt

      # Build before testing: the web suite loads the UI library preset from dist.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
